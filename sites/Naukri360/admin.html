// ═══════════════════════════════════════
// CMS ENGINE
// ═══════════════════════════════════════
var allPages, curSlug, D;
// Migration version. NEVER wipes user's pages — only adds missing fields when
// the data shape evolves. Imported pages, edits, and overrides all survive
// across version bumps.
var CMS_SCHEMA_VERSION = '2026-04-29-non-destructive';
(function init(){
  try{
    var r=localStorage.getItem('cms_pages');allPages=r?JSON.parse(r):null;
  }catch(e){allPages=null}
  if(!allPages) allPages=JSON.parse(JSON.stringify(CMS_PAGES));
  // Migrate stored data — add any fields newer schema versions require, but
  // preserve every page (especially CSV-imported ones).
  (function migrate(){
    var defaultChips=(typeof DEFAULT_CHIPS!=='undefined' && DEFAULT_CHIPS) || [
      {label:'All templates',cat:'all',url:'#templates/all'},
      {label:'Modern',cat:'modern',url:'#templates/modern'},
      {label:'Traditional',cat:'traditional',url:'#templates/traditional'},
      {label:'Simple',cat:'simple',url:'#templates/simple'},
      {label:'Creative',cat:'creative',url:'#templates/creative'},
      {label:'ATS',cat:'ats',url:'#templates/ats'},
      {label:'One page',cat:'onepage',url:'#templates/onepage'},
      {label:'Two column',cat:'twocolumn',url:'#templates/twocolumn'},
      {label:'Photo',cat:'photo',url:'#templates/photo'}
    ];
    Object.keys(allPages).forEach(function(slug){
      var p=allPages[slug];
      if(typeof p.useGlobalFilterChips==='undefined') p.useGlobalFilterChips=true;
      if(!Array.isArray(p.globalFilterChips) || !p.globalFilterChips.length) p.globalFilterChips=JSON.parse(JSON.stringify(defaultChips));
      if(!Array.isArray(p.filterChips)) p.filterChips=[];
      if(typeof p.useGlobalTemplateButton==='undefined') p.useGlobalTemplateButton=true;
      if(typeof p.globalTemplateButtonUrl==='undefined') p.globalTemplateButtonUrl=p.templateButtonUrl||'https://www.naukri.com/resume-editor';
      if(typeof p.globalTemplateButtonText==='undefined') p.globalTemplateButtonText=p.templateButtonText||'Try this free template';
      if(typeof p.useGlobalTemplateLinks==='undefined') p.useGlobalTemplateLinks=true;
      if(!Array.isArray(p.globalTemplates) || !p.globalTemplates.length){
        // Seed from this page's templates list so labels line up.
        p.globalTemplates=(p.templates||[]).map(function(t){return {name:t.name||'',cat:t.cat||'',link:''};});
      }
      if(!p.seo)p.seo={};if(!p.hero)p.hero={};if(!p.schema)p.schema={};
      if(!p.stickyBar)p.stickyBar={};if(!p.sidebar)p.sidebar={};if(!p.globalHeroLinks)p.globalHeroLinks={};
      // Interlinking — replaces the old sec-cv "Resume Examples by Job Title"
      if(typeof p.useGlobalInterlinks==='undefined') p.useGlobalInterlinks=true;
      if(!Array.isArray(p.interlinks)) p.interlinks=[];
      if(!Array.isArray(p.globalInterlinks)) p.globalInterlinks=[];
      if(typeof p.interlinks_heading!=='string'||!p.interlinks_heading) p.interlinks_heading='Explore More Resume Templates';
      if(typeof p.interlinks_sub!=='string') p.interlinks_sub='Browse our complete library of professional templates';
      // Strip retired sec-cv fields so they stop showing in any older UI
      delete p.cv_gallery_heading; delete p.cv_gallery_text;
    });
    // Auto-seed the GLOBAL interlinks pool on first migration so the section
    // is visible immediately on the live preview. Uses every page in CMS as a
    // chip (each page's renderer filters out the current slug at render time).
    var globalPool=[];
    Object.keys(allPages).forEach(function(slug){
      var pp=allPages[slug];
      var label=(pp&&pp.title)||slug;
      var url=(pp&&pp.seo&&pp.seo.canonical)||('https://www.naukri.com/naukri360/'+slug);
      globalPool.push({label:label,url:url});
    });
    Object.keys(allPages).forEach(function(slug){
      var pool=allPages[slug].globalInterlinks;
      if(!pool.length){
        allPages[slug].globalInterlinks=JSON.parse(JSON.stringify(globalPool));
      } else {
        globalPool.forEach(function(link){
          if(!pool.some(function(x){return x.url===link.url;})){
            pool.push({label:link.label,url:link.url});
          }
        });
      }
    });
    try{ localStorage.setItem('cms_schema_version', CMS_SCHEMA_VERSION); }catch(e){}
  })();
  // One-shot cleanup: replace U+FFFD (the "�" in rendered text) baked into
  // localStorage by old CSV imports with their most likely original character
  // (curly apostrophe U+2019). Re-save so the fix is permanent.
  (function(){
    var dirty=false;
    function walk(v){
      if (typeof v==='string'){
        if (v.indexOf('\uFFFD')<0) return v;
        dirty=true;
        return v.replace(/([A-Za-z0-9])\uFFFD([A-Za-z])/g,"$1\u2019$2").replace(/\uFFFD/g,"\u2019");
      }
      if (Array.isArray(v)){ for(var i=0;i<v.length;i++) v[i]=walk(v[i]); return v; }
      if (v&&typeof v==='object'){ for(var k in v) if(Object.prototype.hasOwnProperty.call(v,k)) v[k]=walk(v[k]); return v; }
      return v;
    }
    walk(allPages);
    if(dirty){ try{ localStorage.setItem('cms_pages',JSON.stringify(allPages)); }catch(e){} }
  })();
  curSlug=Object.keys(allPages)[0]||CMS_DEFAULT;
  D=allPages[curSlug];
})();

var panel='pages';
var $=function(s){return document.querySelector(s)};
var $$=function(s){return document.querySelectorAll(s)};
var area=$('#panel-area');
var TITLES={pages:'Page Manager',seo:'SEO & Meta',hero:'Hero / Banner',stickybar:'Sticky Top Bar',templates:'Templates',filterchips:'Filter Chips',interlinks:'Interlinking',content:'Content Sections',sidebar:'Sidebar (3 Steps)',testimonials:'Testimonials',faq:'FAQ',footer:'Footer CTA',csvtool:'CSV Import / Export',cdn:'CDN Image Manager',copypublish:'Copy & Publish',download:'Download / Export HTML'};

function toast(m,ok){var t=$('#toast');t.textContent=m;t.className='show'+(ok===false?' err':'');setTimeout(function(){t.className=''},2500)}
// Auto-publish setting — when ON, every Save & Publish also writes static
// HTML + cms-data.js + sitemap.xml into the connected project folder so the
// /pages/ directory and live preview always reflect the latest CMS state.
var AUTO_PUBLISH = (function(){
  try { return localStorage.getItem('cms_auto_publish') === '1'; } catch(e){ return false; }
})();
function setAutoPublish(on){
  AUTO_PUBLISH = !!on;
  try { localStorage.setItem('cms_auto_publish', on ? '1' : '0'); } catch(e){}
  if (on && !projectDirHandle && fsAccessSupported()){
    toast('Auto-publish ON — connect a project folder (Download panel) for it to take effect.');
  } else {
    toast('Auto-publish ' + (on ? 'ON' : 'OFF'));
  }
}
function doSave(){
  allPages[curSlug]=D;
  localStorage.setItem('cms_pages',JSON.stringify(allPages));
  toast('Saved! ('+Object.keys(allPages).length+' pages)');
  if (AUTO_PUBLISH) autoPublishNow();
}
async function autoPublishNow(){
  // Folder-write path (Chrome/Edge on localhost or HTTPS, after pickProjectFolder).
  if (typeof fsAccessSupported==='function' && fsAccessSupported() && projectDirHandle){
    try{
      var slugs=Object.keys(allPages);
      var saved=0;
      for (var i=0;i<slugs.length;i++){
        var slug=slugs[i];
        var html=buildPageHtml(slug); if(!html) continue;
        var filename='pages/'+slug.replace(/\//g,'-')+'.html';
        var ok=await writeFileToProject(filename,html);
        if(ok) saved++;
      }
      await writeFileToProject('js/cms-data.js',       generateCmsDataJs());
      await writeFileToProject('pages/js/cms-data.js', generateCmsDataJs());
      await writeFileToProject('sitemap.xml',          generateSitemapXml());
      toast('✅ Auto-published '+saved+' pages + cms-data.js + sitemap.xml to '+projectDirHandle.name+'/');
    } catch(e){
      console.warn('[Auto-publish]', e);
      toast('Auto-publish failed: '+e.message+'. Use Download panel manually.', false);
    }
    return;
  }
  // Browser-download fallback — only fire on demand, never on every save (too noisy).
  toast('Auto-publish ON but no project folder connected — use Download panel to push changes.', false);
}
function doReset(){if(!confirm('Reset ALL to defaults?'))return;allPages=JSON.parse(JSON.stringify(CMS_PAGES));curSlug=Object.keys(allPages)[0];D=allPages[curSlug];localStorage.removeItem('cms_pages');render();toast('Reset done')}
function doExport(){dlFile(JSON.stringify(allPages,null,2),'cms-pages.json','application/json');toast('Exported!')}

// ═══════════════════════════════════════════════════════════════
// Repair bullets: rebuild <ul>/<ol> in any text field whose content
// has been mangled to plain "? item" runs by an ANSI CSV round-trip.
// Also repairs <p>…</p>-wrapped / nbsp-separated / inline-run variants.
// ═══════════════════════════════════════════════════════════════
function rescueBulletsText(html){
  if(!html) return html;
  if(/<table[\s>]/i.test(String(html))) return html;
  var s=String(html).replace(/&nbsp;/g,' ').replace(/\u00A0/g,' ');
  var MARK='[?•►▶▪◦‣⁃\\-*]';
  var hit=new RegExp('(?:^|[>\\s\\n\\r:.)!;])\\s*'+MARK+'\\s','g');
  if((s.match(hit)||[]).length<2) return s;
  s=s.replace(/<\/(p|div|li|h[1-6])>\s*<(p|div|li|h[1-6])[^>]*>/gi,'\n')
     .replace(/<\/?(p|div|li|h[1-6])[^>]*>/gi,'\n')
     .replace(/<br\s*\/?>/gi,'\n')
     .replace(/<\/?(span|b|i|em|strong|u|small)[^>]*>/gi,'')
     .replace(new RegExp('([:).!])\\s*('+MARK+')\\s','g'),'$1\n$2 ')
     .replace(new RegExp('\\s+('+MARK+')\\s+','g'),'\n$1 ');
  var lines=s.split(/\r?\n+/).map(function(l){return l.trim()}).filter(Boolean);
  var out=[], buf=[], mode='none';
  var B=new RegExp('^'+MARK+'\\s+(.+)$'), N=/^(\d+)[\.)]\s+(.+)$/;
  function flush(){
    if(!buf.length){mode='none';return}
    if(mode==='ul')      out.push('<ul>'+buf.map(function(t){return'<li>'+t+'</li>'}).join('')+'</ul>');
    else if(mode==='ol') out.push('<ol start="'+buf[0].n+'">'+buf.map(function(x){return'<li value="'+x.n+'">'+x.t+'</li>'}).join('')+'</ol>');
    else                 out.push(buf.join('<br>'));
    buf=[]; mode='none';
  }
  for(var i=0;i<lines.length;i++){
    var line=lines[i], m;
    if((m=line.match(B))){ if(mode!=='ul')flush(); mode='ul'; buf.push(m[1]); }
    else if((m=line.match(N))){ if(mode!=='ol')flush(); mode='ol'; buf.push({n:m[1],t:m[2]}); }
    else { if(mode!=='text')flush(); mode='text'; buf.push(line); }
  }
  flush();
  return out.join('');
}

function repairAllBullets(){
  var TEXT_FIELDS=['text','h3_text']; // per-section rich text fields
  var ANSWER_FIELDS=['a'];            // FAQ answer
  var scanned=0, changed=0;
  Object.keys(allPages).forEach(function(slug){
    var p=allPages[slug];
    // Hero text + footer text + sidebar heading — any string-bearing fields
    ['hero','sidebar','stickyBar'].forEach(function(k){
      if(p[k]) Object.keys(p[k]).forEach(function(kk){
        if(typeof p[k][kk]==='string'){ scanned++; var fixed=rescueBulletsText(p[k][kk]); if(fixed!==p[k][kk]){p[k][kk]=fixed; changed++;} }
      });
    });
    ['footer_text','footer_heading','templates_sub'].forEach(function(k){
      if(typeof p[k]==='string'){ scanned++; var fixed=rescueBulletsText(p[k]); if(fixed!==p[k]){p[k]=fixed; changed++;} }
    });
    if(Array.isArray(p.sections)) p.sections.forEach(function(sec){
      TEXT_FIELDS.forEach(function(f){
        if(typeof sec[f]==='string'){ scanned++; var fixed=rescueBulletsText(sec[f]); if(fixed!==sec[f]){sec[f]=fixed; changed++;} }
      });
    });
    if(Array.isArray(p.faq)) p.faq.forEach(function(f){
      ANSWER_FIELDS.forEach(function(k){
        if(typeof f[k]==='string'){ scanned++; var fixed=rescueBulletsText(f[k]); if(fixed!==f[k]){f[k]=fixed; changed++;} }
      });
    });
    if(Array.isArray(p.content_blocks)) p.content_blocks.forEach(function(b){
      if(typeof b.content==='string'){ scanned++; var fixed=rescueBulletsText(b.content); if(fixed!==b.content){b.content=fixed; changed++;} }
    });
  });
  doSave();
  render();
  toast(changed>0
    ? '✅ Rebuilt '+changed+' text field(s). Reload the live site to see proper bullets.'
    : 'Scanned '+scanned+' fields — no broken bullet runs found. Content already clean.');
}

// ═══════════════════════════════════════════════════════════════
// Persist CMS state back into the project files so the LAN-served
// site and any ZIP/folder share reflect every page we've created.
// This is what makes CMS edits propagate to teammates.
// ═══════════════════════════════════════════════════════════════

// Build a PAGE_TREE {parent: [children]} from the current slug list
function buildPageTree(pages){
  var tree={};
  Object.keys(pages).forEach(function(slug){
    if(slug.indexOf('/')>-1){
      var parent=slug.substring(0,slug.lastIndexOf('/'));
      if(!tree[parent])tree[parent]=[];
      tree[parent].push(slug);
    }
  });
  return tree;
}

// Serialize the live in-memory CMS (allPages) as a full js/cms-data.js file.
// Keeps the helper functions (buildBreadcrumbs, clonePage) frozen at their
// current definitions so the runtime contract is preserved.
function generateCmsDataJs(){
  var pages=allPages;
  var tree=buildPageTree(pages);
  var defaultSlug=(typeof CMS_DEFAULT!=='undefined'&&pages[CMS_DEFAULT])
    ? CMS_DEFAULT
    : Object.keys(pages).filter(function(s){return s.indexOf('/')<0})[0]||Object.keys(pages)[0];
  var helpers=''
    +'function buildBreadcrumbs(slug, title, pages) {\n'
    +'  var root = "https://www.naukri.com";\n'
    +'  var base = root + "/naukri360";\n'
    +'  var crumbs = [\n'
    +'    {n:"Home", u:root},\n'
    +'    {n:"Naukri360", u:base}\n'
    +'  ];\n'
    +'  var parts = String(slug||"").split("/").filter(Boolean);\n'
    +'  var path = "";\n'
    +'  for (var i = 0; i < parts.length; i++) {\n'
    +'    path = path ? path + "/" + parts[i] : parts[i];\n'
    +'    var isLast = (i === parts.length - 1);\n'
    +'    var name;\n'
    +'    if (isLast) {\n'
    +'      name = title;\n'
    +'    } else if (pages && pages[path] && pages[path].title) {\n'
    +'      name = pages[path].title;\n'
    +'    } else {\n'
    +'      name = parts[i].replace(/-/g," ").replace(/\\b\\w/g,function(c){return c.toUpperCase()});\n'
    +'    }\n'
    +'    crumbs.push({n:name, u:base + "/" + path});\n'
    +'  }\n'
    +'  return crumbs;\n'
    +'}\n'
    +'function clonePage(src, slug, title) {\n'
    +'  var c = JSON.parse(JSON.stringify(CMS_PAGES[src]));\n'
    +'  c.slug = slug; c.title = title; c.created = new Date().toISOString().slice(0,10);\n'
    +'  c.seo.title = title + " | Naukri360";\n'
    +'  c.seo.canonical = "https://www.naukri.com/naukri360/" + slug;\n'
    +'  c.hero.h1 = "Free " + title + " Resume Templates";\n'
    +'  c.hero.text = "Create a professional " + title.toLowerCase() + " resume in minutes.";\n'
    +'  var parentSlug = slug.indexOf("/") > -1 ? slug.substring(0, slug.lastIndexOf("/")) : "";\n'
    +'  c.parent = parentSlug;\n'
    +'  c.schema.breadcrumbs = buildBreadcrumbs(slug, title, CMS_PAGES);\n'
    +'  CMS_PAGES[slug] = c;\n'
    +'  return c;\n'
    +'}\n';
  return 'var CMS_PAGES = '+JSON.stringify(pages,null,1)+';\n'
       + 'var PAGE_TREE = '+JSON.stringify(tree,null,1)+';\n'
       + 'var CMS_DEFAULT = '+JSON.stringify(defaultSlug)+';\n'
       + helpers;
}

// Regenerate sitemap.xml from live CMS state so it matches the pages served.
function generateSitemapXml(){
  var today=new Date().toISOString().slice(0,10);
  var slugs=Object.keys(allPages);
  var urls=['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'];
  urls.push('  <url><loc>https://www.naukri.com/naukri360/</loc><lastmod>'+today+'</lastmod><changefreq>weekly</changefreq><priority>1.0</priority></url>');
  slugs.forEach(function(s){
    var p=allPages[s];
    var loc=(p.seo&&p.seo.canonical)||('https://www.naukri.com/naukri360/'+s);
    var priority=(s.indexOf('/')>-1)?'0.8':'0.9';
    urls.push('  <url><loc>'+loc+'</loc><lastmod>'+today+'</lastmod><changefreq>weekly</changefreq><priority>'+priority+'</priority></url>');
  });
  urls.push('</urlset>');
  return urls.join('\n')+'\n';
}

// One-click: download updated js/cms-data.js + sitemap.xml so user can drop
// them into the project (or the ZIP picks them up automatically).
function doPublishCmsData(){
  dlFile(generateCmsDataJs(),'cms-data.js','application/javascript');
  dlFile(generateSitemapXml(),'sitemap.xml','application/xml');
  toast('Downloaded cms-data.js + sitemap.xml ('+Object.keys(allPages).length+' pages). Replace in your project.');
}
function switchPage(s){allPages[curSlug]=D;curSlug=s;D=allPages[s];render()}
function closeModal(){$('#modal').classList.remove('open')}
function dlFile(c,n,t){var b=new Blob([c],{type:t});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}

function doCreatePage(){
  var title=$('#m-title').value.trim();
  var slug=$('#m-slug').value.trim().toLowerCase().replace(/[^a-z0-9\/-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  var from=$('#m-clone-from').value;
  if(!title||!slug){toast('Title & slug required',false);return}
  if(allPages[slug]) slug+='-'+Date.now().toString(36);
  if(from&&allPages[from]){
    var c=JSON.parse(JSON.stringify(allPages[from]));
    c.slug=slug;c.title=title;c.created=new Date().toISOString().slice(0,10);
    c.seo.title=title+' | Naukri360';c.seo.canonical='https://www.naukri.com/naukri360/'+slug;
    c.hero.h1='Free '+title+' Resume Templates';
    c.parent=slug.indexOf('/')>-1?slug.substring(0,slug.lastIndexOf('/')):'';
    c.schema.breadcrumbs=(typeof buildBreadcrumbs==='function')?buildBreadcrumbs(slug,title,allPages):[{n:'Home',u:'https://www.naukri.com/naukri360'},{n:title,u:'https://www.naukri.com/naukri360/'+slug}];
    allPages[slug]=c;
  } else { allPages[slug]=clonePage(CMS_DEFAULT,slug,title); }
  curSlug=slug;D=allPages[slug];doSave();closeModal();render();toast('Page "'+title+'" created!')
}

// ═══════════════════════════════════════
// FIELD HELPERS
// ═══════════════════════════════════════
var fid=0;
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function stripH(s){var d=document.createElement('div');d.innerHTML=s||'';return d.textContent||''}
// HTML → plain text preserving line breaks (for CSV export of rich-text fields)
function htmlToText(s){
  if(!s)return'';
  // If content contains a table, keep the original HTML verbatim — tables are
  // hard to represent in plain CSV and textToHtml re-detects raw HTML on import.
  if(/<table[\s>]/i.test(String(s))) return String(s);
  // Round-trip: convert UL bullet lists back to "- item" markdown.
  // Ordered lists use the literal <li data-num="N"> prefix we wrote on import,
  // so on export we rebuild "N. item" with the ORIGINAL number (not a re-count).
  var str=String(s);
  str=str.replace(/<ol([^>]*)>([\s\S]*?)<\/ol>/gi,function(_,olAttrs,inner){
    var startMatch=olAttrs.match(/start="(\d+)"/i);
    var counter=startMatch?parseInt(startMatch[1],10):1;
    return '\n'+inner.replace(/<li([^>]*)>([\s\S]*?)<\/li>/gi,function(__,liAttrs,li){
      var vm=liAttrs.match(/value="(\d+)"/i)||liAttrs.match(/data-num="(\d+)"/i);
      var n=vm?vm[1]:counter;
      counter=parseInt(n,10)+1;
      return n+'. '+li.replace(/<[^>]*>/g,'').trim()+'\n';
    }).trim()+'\n';
  });
  str=str.replace(/<ul[^>]*>([\s\S]*?)<\/ul>/gi,function(_,inner){
    return '\n'+inner.replace(/<li[^>]*>([\s\S]*?)<\/li>/gi,function(__,li){
      return '- '+li.replace(/<[^>]*>/g,'').trim()+'\n';
    }).trim()+'\n';
  });
  str=str
    .replace(/<\/p>\s*<p[^>]*>/gi,'\n\n')
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<\/(div|h[1-6])>\s*<(div|h[1-6])[^>]*>/gi,'\n');
  var d=document.createElement('div');d.innerHTML=str;
  return (d.textContent||'').replace(/\u00A0/g,' ').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}

// Plain text → HTML. Preserves line breaks from CSV exactly as written.
// Only two structural conversions:
//   "- ", "* ", "• "   → <ul> bullet list item (the marker is stripped; CSS renders "•")
//   "1. ", "2) " ...   → <ol> ordered list item, with the EXACT number from the CSV
//                         preserved via <li data-num="N">. CSS renders "N." so gaps
//                         ("1.", "2.", "5.") stay as the user typed them.
// Everything else becomes plain text with <br> line breaks.
function textToHtml(s){
  if(!s)return'';
  var str=String(s);
  if(/<(p|br|div|ul|ol|li|h[1-6]|strong|em|b|i|a|span|table|thead|tbody|tr|th|td)[\s>\/]/i.test(str))return str;
  function escHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var lines=str.replace(/\r\n?/g,'\n').split('\n');
  var out=[], buf=[], mode='none'; // none | ul | ol | text
  function flush(){
    if(!buf.length){mode='none';return;}
    if(mode==='ul'){
      // Native <ul> — browser default renders a disc marker, works in every font + cache state.
      out.push('<ul>'+buf.map(function(x){return '<li>'+x.text+'</li>';}).join('')+'</ul>');
    } else if(mode==='ol'){
      // <li value="N"> preserves the ORIGINAL number from the CSV ("1., 2., 5., 10.") using
      // the browser's native ordered-list marker — no ::before tricks, no font/encoding risk.
      var start=buf[0].num||'1';
      out.push('<ol start="'+start+'">'+buf.map(function(x){return '<li value="'+x.num+'">'+x.text+'</li>';}).join('')+'</ol>');
    } else {
      out.push(buf.join('<br>'));
    }
    buf=[]; mode='none';
  }
  for(var i=0;i<lines.length;i++){
    var raw=lines[i];
    var line=raw.replace(/^\s+/,'');
    if(line===''){flush(); continue;}
    var m;
    // Bullet markers include ?, which is what Excel substitutes when saving a
    // Unicode bullet (•) to a legacy ANSI CSV — by the time the import runs,
    // the real bullet is already gone, so we have to accept ? as a stand-in.
    if((m=line.match(/^[-*•?►▶▪◦‣⁃]\s+(.*)$/))){
      if(mode!=='ul')flush();
      mode='ul'; buf.push({text:escHtml(m[1])});
    } else if((m=line.match(/^(\d+)[\.)]\s+(.*)$/))){
      if(mode!=='ol')flush();
      mode='ol'; buf.push({num:m[1], text:escHtml(m[2])});
    } else {
      if(mode!=='text')flush();
      mode='text'; buf.push(escHtml(line));
    }
  }
  flush();
  return out.join('');
}

function pPages(){
  var slugs=Object.keys(allPages);
  // Count how many pages share the same SEO title, so duplicates (the
  // exact "fell back to hub defaults" bug) are visible right in this list.
  var titleCounts={};
  slugs.forEach(function(s){
    var t=(allPages[s].seo&&allPages[s].seo.title)||'';
    if(t) titleCounts[t]=(titleCounts[t]||0)+1;
  });
  var h='<div class="card"><div class="ct">All Pages ('+slugs.length+')</div>';
  h+='<div class="card-info">Select a page to edit. Clone to create new ones. <strong>Bold</strong> is the live SEO title tag (<code>&lt;title&gt;</code>); the line below it is this page\'s internal name in the CMS.</div>';
  slugs.forEach(function(s){
    var p=allPages[s],cur=s===curSlug;
    var seoTitle=(p.seo&&p.seo.title)||'';
    var isDup=seoTitle&&titleCounts[seoTitle]>1;
    h+='<div class="pg-item'+(cur?' pg-active':'')+'"><div class="pg-info"><strong>'+esc(seoTitle||'(no SEO title set)')+'</strong> <span class="pg-slug">/'+s+'</span>'+(cur?' <span class="badge-b">editing</span>':'')+(isDup?' <span class="badge-warn">⚠ duplicate title — shared with '+(titleCounts[seoTitle]-1)+' other page(s)</span>':'')+'<div class="pg-title-sub">Page name: '+esc(p.title)+'</div></div><div class="pg-btns">';
    if(!cur)h+='<button class="tb-btn sm" onclick="switchPage(\''+s+'\')">Edit</button>';
    h+='<button class="tb-btn sm outline" onclick="openClone(\''+s+'\')">Clone</button>';
    h+='<button class="tb-btn sm" onclick="window.open(\'index.html?page='+s+'\',\'_blank\')">Preview</button>';
    if(slugs.indexOf(s)>0)h+='<button class="tb-btn sm danger" onclick="if(confirm(\'Delete /'+s+'?\')){delete allPages[\''+s+'\'];if(curSlug===\''+s+'\'){curSlug=Object.keys(allPages)[0];D=allPages[curSlug]}syncGlobalInterlinks();doSave();render()}">Del</button>';
    h+='</div></div>';
  });
  h+='<div class="pg-add"><button class="tb-btn primary" onclick="openClone(curSlug)">+ Clone Current</button> <button class="tb-btn outline" onclick="openCreate()">+ New Blank</button></div></div>';
  return h;
}

function renderChipEditor(arr, pathPrefix){

function pFilterChips(){
  // If this page has no globalFilterChips yet, pull from another page that
  // already has them (preserving user customisations made on a different page)
  // before falling back to the built-in defaults.
  if(!D.globalFilterChips||!D.globalFilterChips.length){
    var donor=null;
    Object.keys(allPages).some(function(slug){
      var gp=allPages[slug].globalFilterChips;
      if(slug!==curSlug && Array.isArray(gp) && gp.length){ donor=gp; return true; }
    });
    D.globalFilterChips=donor
      ? JSON.parse(JSON.stringify(donor))
      : JSON.parse(JSON.stringify(DEFAULT_CHIPS));
  }
  if(!Array.isArray(D.filterChips)) D.filterChips=[];
  if(typeof D.useGlobalFilterChips==='undefined') D.useGlobalFilterChips=true;
  // After potentially seeding D.globalFilterChips, mirror to every other page
  // so the global pool stays consistent.
  syncGlobalChips();

  var h='<div class="card"><div class="ct">📌 Filter Chips — Templates section filters</div>';
  h+='<div class="card-info">Each chip filters the templates grid by category. The <b>Global</b> set applies to every page; toggle off below to give this page its own chip list. Default chip URLs use <code>#templates/&lt;cat&gt;</code> for in-page filtering — replace with full URLs (e.g. <code>https://www.naukri.com/naukri360/resume-templates/modern</code>) to send each chip to its own page.</div></div>';

  h+='<small>'+(D.useGlobalFilterChips?'Global chips will be rendered on this page. Switch off to override below.':'This page is using its own chip list (overrides global).')+'</small></div></div>';

  // Per-page list (only when override is on)
  if(!D.useGlobalFilterChips){
    h+='<div class="card"><div class="ct">Per-page chips ('+D.filterChips.length+')</div>';
    h+='<div class="card-info">These appear only on <b>'+esc(D.title||curSlug)+'</b>.</div>';
    h+=renderChipEditor(D.filterChips,'D.filterChips');

    h+='<button class="tb-btn outline full" style="margin-top:8px" onclick="D.filterChips=JSON.parse(JSON.stringify(D.globalFilterChips));render()">Copy global chips into this page</button></div>';
  }

  // Global list — always visible
  h+='<div class="card"><div class="ct">🌐 Global chips ('+D.globalFilterChips.length+')</div>';
  h+='<div class="card-info">Edit once, applies to every page that has "Use global filter chips" enabled.</div>';
  h+=renderChipEditor(D.globalFilterChips,'D.globalFilterChips');
  h+='<button class="tb-btn primary full" onclick="D.globalFilterChips.push({label:\'New\',cat:\'all\',url:\'#templates/all\'});syncGlobalChips();render()">+ Add Chip</button>';
  h+='<button class="tb-btn outline full" style="margin-top:8px" onclick="if(confirm(\'Reset global chips to defaults?\')){D.globalFilterChips=JSON.parse(JSON.stringify(DEFAULT_CHIPS));syncGlobalChips();render();}">Reset to defaults</button></div>';

  return h;
}

function pruneInterlinks(arr){
  var base='https://www.naukri.com/naukri360/';
  return (Array.isArray(arr)?arr:[]).filter(function(x){
    if(!x||!x.url) return false;
    if(x.url.indexOf(base)===0){
      var s=x.url.slice(base.length).replace(/\/+$/,'');
      return !!allPages[s];
    }
    return true;
  });
}
function renderInterlinkEditor(arr, pathPrefix){
  var afterMutate = (pathPrefix==='D.globalInterlinks') ? 'syncGlobalInterlinks();render()' : 'render()';
  var html='';
  arr.forEach(function(c,i){
    html+='<div class="rep"><div class="rep-h"><strong>#'+(i+1)+' '+esc(c.label||'(empty)')+'</strong><div>';
    if(i>0)html+='<button class="tb-btn sm" onclick="var x='+pathPrefix+'.splice('+i+',1)[0];'+pathPrefix+'.splice('+(i-1)+',0,x);'+afterMutate+'">&uarr;</button>';
    if(i<arr.length-1)html+='<button class="tb-btn sm" onclick="var x='+pathPrefix+'.splice('+i+',1)[0];'+pathPrefix+'.splice('+(i+1)+',0,x);'+afterMutate+'">&darr;</button>';
    html+='<button class="tb-btn sm danger" onclick="'+pathPrefix+'.splice('+i+',1);'+afterMutate+'">Del</button></div></div>';
    html+=F('Label',c.label,pathPrefix+'['+i+'].label','Visible chip text e.g. "Software Engineer Resume"');
    html+=F('Link URL',c.url,pathPrefix+'['+i+'].url','Full URL or relative path');
    html+='</div>';
  });
  return html;
}

  if(!Array.isArray(D.interlinks)) D.interlinks=[];

  h+='<small>'+(D.useGlobalInterlinks?'Global chips render on this page. Switch off to override below.':'This page is using its own interlinks list (overrides global).')+'</small></div></div>';
  if(!D.useGlobalInterlinks){
    h+='<div class="card"><div class="ct">Per-page links ('+D.interlinks.length+')</div>';
    h+='<div class="card-info">These appear only on <b>'+esc(D.title||curSlug)+'</b>.</div>';
    h+=renderInterlinkEditor(D.interlinks,'D.interlinks');
    h+='<button class="tb-btn primary full" onclick="D.interlinks.push({label:\'New link\',url:\'#\'});render()">+ Add Link</button>';
    h+='<button class="tb-btn outline full" style="margin-top:8px" onclick="D.interlinks=JSON.parse(JSON.stringify(D.globalInterlinks));render()">Copy global links into this page</button></div>';
  }
  h+='<div class="card"><div class="ct">🌐 Global links ('+D.globalInterlinks.length+')</div>';
  h+='<div class="card-info">Edit once, applies to every page that has "Use global interlinks" enabled.</div>';
  h+=renderInterlinkEditor(D.globalInterlinks,'D.globalInterlinks');
  h+='<button class="tb-btn primary full" onclick="D.globalInterlinks.push({label:\'New link\',url:\'#\'});syncGlobalInterlinks();render()">+ Add Link</button>';
  h+='<button class="tb-btn outline full" style="margin-top:8px" onclick="if(confirm(\'Seed global interlinks from every other page in CMS?\')){seedInterlinksFromPages();syncGlobalInterlinks();render();}">Seed from existing pages</button></div>';
  return h;
}
function seedInterlinksFromPages(){
  if(!Array.isArray(D.globalInterlinks)) D.globalInterlinks=[];
  Object.keys(allPages).forEach(function(slug){
    if(slug===curSlug) return;
    var pp=allPages[slug];
    var label=(pp&&pp.title)||slug;
    var url=(pp&&pp.seo&&pp.seo.canonical)||('https://www.naukri.com/naukri360/'+slug);
    if(!D.globalInterlinks.some(function(x){return x.url===url})) D.globalInterlinks.push({label:label,url:url});
  });
}
function syncGlobalInterlinks(){
  if(!D || !Array.isArray(D.globalInterlinks)) return;
  D.globalInterlinks=pruneInterlinks(D.globalInterlinks);
  var snap=JSON.stringify(D.globalInterlinks);
  Object.keys(allPages).forEach(function(slug){
    if(slug===curSlug) return;
    allPages[slug].globalInterlinks=JSON.parse(snap);
    if(Array.isArray(allPages[slug].interlinks))
      allPages[slug].interlinks=pruneInterlinks(allPages[slug].interlinks);
  });
  if(Array.isArray(D.interlinks)) D.interlinks=pruneInterlinks(D.interlinks);
}

function csvQ(v){v=String(v||'');return(v.indexOf(',')>=0||v.indexOf('"')>=0||v.indexOf('\n')>=0)?'"'+v.replace(/"/g,'""')+'"':v}
function parseCsvLine(l){var r=[],c='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(q){if(ch==='"'&&l[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}else{if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else c+=ch}}r.push(c);return r}
// RFC 4180 tokenizer — handles quoted fields with embedded newlines/commas/""
function parseCsvAll(text){
  var rows=[],row=[],c='',q=false,i=0,n=text.length;
  while(i<n){
    var ch=text.charAt(i);
    if(q){
      if(ch==='"'){
        if(text.charAt(i+1)==='"'){c+='"';i+=2;continue}
        q=false;i++;continue;
      }
      c+=ch;i++;continue;
    }
    if(ch==='"'){q=true;i++;continue}
    if(ch===','){row.push(c);c='';i++;continue}
    if(ch==='\r'){if(text.charAt(i+1)==='\n')i++;row.push(c);rows.push(row);row=[];c='';i++;continue}
    if(ch==='\n'){row.push(c);rows.push(row);row=[];c='';i++;continue}
    c+=ch;i++;
  }
  if(c!==''||row.length){row.push(c);rows.push(row)}
  return rows;
}

// Base columns (non-repeating)
var CSV_BASE_COLS=['slug','title','parent','seo_title','seo_desc','seo_keywords','canonical_url',
  'hero_h1','hero_text','cta1_text','cta1_url','cta2_text','cta2_url',
  'template_button_text','template_button_url',
  'template_pdf_url','template_doc_url',
  'templates_heading','templates_sub','testimonials_heading',
  'footer_heading','footer_text',
  'bar_text','bar_link_text','bar_link_url',
  'sidebar_heading','sidebar_cta_text','sidebar_cta_url'];

function buildCsvHeader(maxSections, maxFaqs){
  var cols=CSV_BASE_COLS.slice();
  for(var i=1;i<=maxSections;i++){
    cols.push('section'+i+'_h2','section'+i+'_text','section'+i+'_image',
              'section'+i+'_h3','section'+i+'_h3_text','section'+i+'_points');
  }
  for(var i=1;i<=maxFaqs;i++){
    cols.push('faq_q'+i,'faq_a'+i);
  }
  return cols;
}

// Detect max sections and FAQs across all pages
function getMaxCounts(){
  var maxSec=2,maxFaq=5; // defaults (at least 2 sections and 5 FAQs for flexibility)
  Object.keys(allPages).forEach(function(s){
    var p=allPages[s];
    if((p.sections||[]).length>maxSec)maxSec=p.sections.length;
    if((p.faq||[]).length>maxFaq)maxFaq=p.faq.length;
  });
  return {maxSec:maxSec,maxFaq:maxFaq};
}

function doCsvExport(){
  var mc=getMaxCounts();
  var cols=buildCsvHeader(mc.maxSec,mc.maxFaq);

      seo_title:p.seo.title,seo_desc:p.seo.desc,seo_keywords:p.seo.keywords,canonical_url:p.seo.canonical,

      template_doc_url:p.globalTemplateDocUrl||p.templateDocUrl||'',
      templates_heading:stripH(p.templates_heading||''),
      templates_sub:stripH(p.templates_sub||''),
      testimonials_heading:stripH(p.testimonials_heading||''),
      footer_heading:stripH(p.footer_heading||''),footer_text:stripH(p.footer_text||''),
      bar_text:sb.text||'',bar_link_text:sb.linkText||'',bar_link_url:sb.linkUrl||'',
      sidebar_heading:stripH(sd.heading||''),
      sidebar_cta_text:sd.ctaText||'',sidebar_cta_url:sd.ctaUrl||''
    };

    // Sections (dynamic) — preserve line breaks in rich-text fields
    for(var si=1;si<=mc.maxSec;si++){

function doCsvImport(){
  var el=document.getElementById('csvFile');if(!el||!el.files[0]){toast('Select CSV first',false);return}
  var f=el.files[0];
  // Reject Excel/binary files — xlsx is a zip (PK header) and would parse as garbage
  var name=(f.name||'').toLowerCase();
  if(/\.(xlsx|xls|xlsm|xlsb|ods|numbers)$/.test(name)){
    toast('Excel files not supported — save as CSV first (File → Save As → CSV)',false);return;
  }
  if(!/\.csv$/.test(name)){
    if(!confirm('File "'+f.name+'" is not a .csv. Continue anyway?'))return;
  }
  var reader=new FileReader();
  reader.onerror=function(){toast('Failed to read file',false)};
  reader.onload=function(e){
    // Decode with UTF-8 first; on decode errors or if replacement char (U+FFFD) appears,
    // fall back to Windows-1252 (Excel's default on Windows, where curly apostrophes → 0x92).
    var buf=e.target.result;
    var bytes=new Uint8Array(buf);
    // Detect binary garbage (xlsx zip starts with PK)
    if(bytes[0]===0x50&&bytes[1]===0x4B){
      toast('This looks like an Excel/ZIP file, not CSV. Save as CSV first.',false);return;
    }
    var text='';
    try{
      text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);
    }catch(err){
      try{text=new TextDecoder('windows-1252').decode(bytes);}
      catch(e2){text=new TextDecoder('iso-8859-1').decode(bytes);}
    }
    // Some Excel/CP1252 exports ARE valid UTF-8 byte sequences yet contain U+FFFD placeholders —
    // re-decode as cp1252 if we see the replacement character.
    if(text.indexOf('\uFFFD')>=0){
      try{
        var alt=new TextDecoder('windows-1252').decode(bytes);
        if(alt.indexOf('\uFFFD')<0)text=alt;
      }catch(e3){}
    }
    if(text.indexOf('\u0000')>=0){
      toast('Binary data detected — file is not plain CSV.',false);return;
    }
    // Strip BOM (Excel adds \uFEFF)
    if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
    // Normalize Windows-1252 smart punctuation that sometimes slips through as raw bytes
    text=text
      .replace(/\u0092/g,"\u2019").replace(/\u0091/g,"\u2018")
      .replace(/\u0093/g,"\u201C").replace(/\u0094/g,"\u201D")
      .replace(/\u0096/g,"\u2013").replace(/\u0097/g,"\u2014");
    // Full RFC 4180 parse — handles multi-line quoted cells (bullet points in Excel)
    var allRows=parseCsvAll(text);
    // Drop comment rows (# prefix) and fully blank rows
    var rows=allRows.filter(function(r){
      if(!r.length)return false;
      var first=(r[0]||'').trim();
      if(first.charAt(0)==='#')return false;
      // keep row if any cell has content
      return r.some(function(v){return(v||'').trim()!==''});
    });
    if(rows.length<2){toast('Need header+data',false);return}
    var hdrs=rows[0].map(function(h){return(h||'').trim()});
    if(hdrs[0]!=='slug'){
      toast('First column must be "slug" (got "'+hdrs[0].substring(0,30)+'")',false);return;
    }
    var count=0;
    var updateSummary={urls:0,sections:0,faqs:0,newPages:0};
    var debug=[];

    // Detect dynamic section & FAQ columns in THIS CSV
    var secNums={}, faqNums={};
    hdrs.forEach(function(h){
      var m=h.match(/^section(\d+)_/); if(m) secNums[m[1]]=true;
      var f=h.match(/^faq_q(\d+)$/); if(f) faqNums[f[1]]=true;
    });
    var secList=Object.keys(secNums).map(Number).sort(function(a,b){return a-b});
    var faqList=Object.keys(faqNums).map(Number).sort(function(a,b){return a-b});

    // Helper: only update if value is non-empty, or handle [CLEAR] marker
    function setIf(obj,key,val){
      if(val===undefined||val===null||val==='')return false;
      if(val==='[CLEAR]'){obj[key]='';return true}
      obj[key]=val;return true;
    }

    for(var i=1;i<rows.length;i++){
      var vals=rows[i];
      if(!vals[0]||!vals[0].trim())continue;
      var slug=vals[0].trim();
      // Reject slugs with whitespace/control chars — catches fragmented rows
      if(/[\s]/.test(slug)||slug.length>120){
        debug.push('Skipped invalid slug: '+slug.substring(0,40));continue;
      }
      var row={};hdrs.forEach(function(h,j){row[h]=(vals[j]||'').trim()});

      // Create or find page
      if(!allPages[slug]){
        allPages[slug]=JSON.parse(JSON.stringify(allPages[Object.keys(allPages)[0]]));
        allPages[slug].slug=slug;
        updateSummary.newPages++;
      }
      var p=allPages[slug];
      if(!p.seo)p.seo={};if(!p.hero)p.hero={};if(!p.schema)p.schema={};
      if(!p.stickyBar)p.stickyBar={};if(!p.sidebar)p.sidebar={};if(!p.globalHeroLinks)p.globalHeroLinks={};

      // Basic fields
      setIf(p,'title',row.title);
      if(row.parent!==undefined)p.parent=row.parent;

      // SEO — urls must update!
      setIf(p.seo,'title',row.seo_title);
      setIf(p.seo,'desc',row.seo_desc);
      setIf(p.seo,'keywords',row.seo_keywords);
      if(setIf(p.seo,'canonical',row.canonical_url))updateSummary.urls++;

      // Hero
      setIf(p.hero,'h1',row.hero_h1);
      setIf(p.hero,'text',row.hero_text);
      setIf(p.hero,'cta1',row.cta1_text);
      if(setIf(p.hero,'cta1_url',row.cta1_url)){
        p.globalHeroLinks.cta1_url=row.cta1_url; // also update global fallback
        updateSummary.urls++;
      }
      setIf(p.hero,'cta2',row.cta2_text);
      if(setIf(p.hero,'cta2_url',row.cta2_url)){
        p.globalHeroLinks.cta2_url=row.cta2_url;
        updateSummary.urls++;
      }

      // Template button
      setIf(p,'templateButtonText',row.template_button_text);
      if(setIf(p,'templateButtonUrl',row.template_button_url))updateSummary.urls++;
      // Template PDF/DOC download URLs (global per page)
      if(setIf(p,'globalTemplatePdfUrl',row.template_pdf_url))updateSummary.urls++;
      if(setIf(p,'globalTemplateDocUrl',row.template_doc_url))updateSummary.urls++;

      // Headings
      setIf(p,'templates_heading',row.templates_heading);
      setIf(p,'templates_sub',row.templates_sub);
      setIf(p,'testimonials_heading',row.testimonials_heading);
      setIf(p,'footer_heading',row.footer_heading);
      setIf(p,'footer_text',row.footer_text);

      // Sticky bar
      setIf(p.stickyBar,'text',row.bar_text);
      setIf(p.stickyBar,'linkText',row.bar_link_text);
      if(setIf(p.stickyBar,'linkUrl',row.bar_link_url))updateSummary.urls++;

      // Sidebar
      setIf(p.sidebar,'heading',row.sidebar_heading);
      setIf(p.sidebar,'ctaText',row.sidebar_cta_text);
      if(setIf(p.sidebar,'ctaUrl',row.sidebar_cta_url))updateSummary.urls++;

      // Content sections (dynamic — rebuild from CSV if ANY section col present)
      var hasSectionCols=secList.length>0;
      var csvSections=[];
      secList.forEach(function(n){
        var h2=row['section'+n+'_h2']||'';
        var txt=row['section'+n+'_text']||'';
        var img=row['section'+n+'_image']||'';
        var h3=row['section'+n+'_h3']||'';
        var h3t=row['section'+n+'_h3_text']||'';
        var pts=row['section'+n+'_points']||'';
        if(h2||txt||img||h3||h3t||pts){
          var pointsArr=pts?pts.split('|').map(function(x){return x.trim()}).filter(Boolean):[];
          csvSections.push({
            type:pointsArr.length?'text-with-points':'text',
            h2:h2==='[CLEAR]'?'':h2,
            text:txt==='[CLEAR]'?'':textToHtml(txt),
            image:img==='[CLEAR]'?'':img,
            h3:h3==='[CLEAR]'?'':h3,
            h3_text:h3t==='[CLEAR]'?'':textToHtml(h3t),
            points:pointsArr
          });
        }
      });
      if(hasSectionCols&&csvSections.length>0){
        p.sections=csvSections;
        updateSummary.sections+=csvSections.length;
      }

      // FAQs (dynamic — rebuild from CSV if ANY faq col present)
      var hasFaqCols=faqList.length>0;
      var csvFaqs=[];
      faqList.forEach(function(n){
        var q=row['faq_q'+n]||'';var a=row['faq_a'+n]||'';
        if(q||a){
          csvFaqs.push({q:q==='[CLEAR]'?'':q,a:a==='[CLEAR]'?'':textToHtml(a)});
        }
      });
      if(hasFaqCols&&csvFaqs.length>0){
        p.faq=csvFaqs;
        updateSummary.faqs+=csvFaqs.length;
      }

      // Rebuild breadcrumbs from title + slug (folder-aware)
      if(!p.schema.breadcrumbs)p.schema.breadcrumbs=[];
      p.parent=slug.indexOf('/')>-1?slug.substring(0,slug.lastIndexOf('/')):'';
      p.schema.breadcrumbs=(typeof buildBreadcrumbs==='function')
        ? buildBreadcrumbs(slug, p.title||slug, allPages)
        : [{n:'Home',u:'https://www.naukri.com/naukri360'},{n:p.title||slug,u:p.seo.canonical||('https://www.naukri.com/naukri360/'+slug)}];

      debug.push(slug+' → canonical:'+p.seo.canonical+', cta1_url:'+(p.hero.cta1_url||'—')+', sections:'+(p.sections||[]).length+', faqs:'+(p.faq||[]).length);
      count++;
    }

    try{doSave();}catch(err){toast('Save failed: '+(err&&err.name==='QuotaExceededError'?'storage full':err.message),false);return}
    render();
    console.log('[CSV Import] Detected section cols:',secList,'| FAQ cols:',faqList);
    console.log('[CSV Import] Per-page details:\n'+debug.join('\n'));

// Auto-sync the current allPages snapshot into the project folder. If the
// File System Access API + a folder handle are available, write each page's
// HTML plus js/cms-data.js + sitemap.xml directly. Otherwise fall back to
// downloading js/cms-data.js + sitemap.xml so the user can drop them into
// the project before re-zipping.
async function persistImportedPages(totalImported, newPagesCount){
  // Always download the regenerated cms-data.js + sitemap.xml so the user has
  // a self-contained snapshot they can drop into any project copy / share.
  // Folder-write also runs if a directory handle exists, for instant updates.
  if (typeof fsAccessSupported==='function' && fsAccessSupported() && projectDirHandle){
    try{
      var saved=0;
      var slugs=Object.keys(allPages);
      for (var i=0;i<slugs.length;i++){
        var slug=slugs[i];
        var html=buildPageHtml(slug); if(!html) continue;
        var filename='pages/'+slug.replace(/\//g,'-')+'.html';
        var ok=await writeFileToProject(filename,html);
        if(ok) saved++;
      }
      await writeFileToProject('js/cms-data.js',       generateCmsDataJs());
      await writeFileToProject('pages/js/cms-data.js', generateCmsDataJs());
      await writeFileToProject('sitemap.xml',          generateSitemapXml());
      toast('✅ Synced '+saved+' page(s) → /pages/ + cms-data.js + sitemap.xml — ready to zip & share');
      return;
    }catch(e){
      console.warn('[CSV Import] folder-write failed, falling back to download:',e);
    }
  }
  // Fallback: download the regenerated data files
  try{
    dlFile(generateCmsDataJs(), 'cms-data.js', 'application/javascript');
    dlFile(generateSitemapXml(), 'sitemap.xml', 'application/xml');
    toast('⬇ Downloaded cms-data.js + sitemap.xml — replace the files in your project folder, then re-zip to ship the '+totalImported+' imported page(s).');
  }catch(e){
    toast('CSV imported but could not auto-sync: '+e.message+'. Use Download HTML → Publish CMS Data to save manually.', false);
  }
}

// HTML IMPORT — reverse-parse a rendered page
// (this CMS's own export, or any pages/*.html from the site) back into
// CMS field data. Best-effort: only fields actually found are written.
// ═══════════════════════════════════════
function parseImportedHtml(htmlText){
  var doc=new DOMParser().parseFromString(htmlText,'text/html');
  var out={seo:{},hero:{}};

  var titleEl=doc.querySelector('title');
  if(titleEl&&titleEl.textContent.trim()) out.seo.title=titleEl.textContent.trim();
  var descEl=doc.querySelector('meta[name="description"]');
  if(descEl&&descEl.getAttribute('content')) out.seo.desc=descEl.getAttribute('content');
  var kwEl=doc.querySelector('meta[name="keywords"]');
  if(kwEl&&kwEl.getAttribute('content')) out.seo.keywords=kwEl.getAttribute('content');
  var canEl=doc.querySelector('link[rel="canonical"]');
  if(canEl&&canEl.getAttribute('href')) out.seo.canonical=canEl.getAttribute('href');
  var ogImgEl=doc.querySelector('meta[property="og:image"]');
  if(ogImgEl&&ogImgEl.getAttribute('content')) out.seo.ogImage=ogImgEl.getAttribute('content');

  var h1El=doc.querySelector('#hero-h1')||doc.querySelector('h1');
  if(h1El&&h1El.textContent.trim()) out.hero.h1=h1El.textContent.trim();
  var pEl=doc.querySelector('.banner-left p');
  if(pEl&&pEl.textContent.trim()) out.hero.text=pEl.textContent.trim();
  var cta1El=doc.querySelector('.get-started');
  if(cta1El){ out.hero.cta1=cta1El.textContent.trim(); out.hero.cta1_url=cta1El.getAttribute('href')||''; }
  var cta2El=doc.querySelector('.become-pro');
  if(cta2El){ out.hero.cta2=cta2El.textContent.trim(); out.hero.cta2_url=cta2El.getAttribute('href')||''; }

  var sbEl=doc.querySelector('#stickyBar');
  if(sbEl){
    out.stickyBar={};
    var bt=sbEl.querySelector('#bar-text'); if(bt) out.stickyBar.text=bt.textContent.trim();
    var bl=sbEl.querySelector('#bar-link'); if(bl) out.stickyBar.linkUrl=bl.getAttribute('href')||'';
    var blt=sbEl.querySelector('#bar-linktext'); if(blt) out.stickyBar.linkText=blt.textContent.trim();
  }

  var faqList=[],breadcrumbs=null,rating=null,templates=[];
  Array.from(doc.querySelectorAll('script[type="application/ld+json"]')).forEach(function(s){
    var data; try{ data=JSON.parse(s.textContent); }catch(e){ return; }
    var type=data['@type'];
    if(type==='FAQPage'&&Array.isArray(data.mainEntity)){
      data.mainEntity.forEach(function(q){
        faqList.push({q:q.name||'',a:(q.acceptedAnswer&&q.acceptedAnswer.text)||''});
      });
    } else if(type==='BreadcrumbList'&&Array.isArray(data.itemListElement)){
      breadcrumbs=data.itemListElement.map(function(li){return {n:li.name||'',u:li.item||''};});
    } else if(type==='SoftwareApplication'&&data.aggregateRating&&data.url&&out.seo.canonical&&data.url===out.seo.canonical){
      // Only trust the rating block whose own url matches this page's canonical —
      // pages also embed a second, unrelated "Naukri Resume Maker" schema block.
      rating={ratingValue:data.aggregateRating.ratingValue,ratingCount:data.aggregateRating.ratingCount,reviewCount:data.aggregateRating.reviewCount};
    } else if((type==='ItemList'&&s.id==='schema-itemlist')||type==='CollectionPage'){
      var il=type==='ItemList'?data:(data.mainEntity||null);
      if(il&&Array.isArray(il.itemListElement)){
        templates=il.itemListElement.map(function(li){
          var it=li.item||{};
          return {name:it.name||'',desc:it.description||'',image:it.image||'',link:(it.url&&it.url!==out.seo.canonical)?it.url:''};
        });
      }
    }
  });
  if(faqList.length) out.faq=faqList;
  if(breadcrumbs||rating){
    out.schema={};
    if(breadcrumbs) out.schema.breadcrumbs=breadcrumbs;
    if(rating){ out.schema.ratingValue=rating.ratingValue; out.schema.ratingCount=rating.ratingCount; out.schema.reviewCount=rating.reviewCount; }
  }
  if(templates.length) out.templates=templates;
  return out;
}

function slugFromCanonical(url){
  if(!url) return null;
  var m=String(url).match(/naukri360\/?(.*)$/i);
  var slug=m?m[1]:null;
  if(!slug) return null;
  return slug.replace(/^\/+|\/+$/g,'').toLowerCase();
}

// Core merge — no save/render/toast side effects, so bulk import can call
// this in a loop and only save+render once at the end.
// Returns {ok:false,reason:'no-data'|'no-slug'} or {ok:true,slug,isNew}.
function mergeHtmlDataIntoPages(parsed){
  if(!parsed||(!parsed.seo.title&&!parsed.hero.h1)) return {ok:false,reason:'no-data'};
  var slug=slugFromCanonical(parsed.seo.canonical);
  if(!slug) return {ok:false,reason:'no-slug'};
  var isNew=!allPages[slug];
  var target;
  if(isNew){
    var base=allPages[curSlug]||allPages[Object.keys(allPages)[0]];
    target=JSON.parse(JSON.stringify(base));
    target.slug=slug;
    target.created=new Date().toISOString().slice(0,10);
    target.published=true;
    target.parent=slug.indexOf('/')>-1?slug.substring(0,slug.lastIndexOf('/')):'';
    allPages[slug]=target;
  } else {
    target=allPages[slug];
  }
  Object.assign(target.seo,parsed.seo);
  Object.assign(target.hero,parsed.hero);
  if(parsed.stickyBar) Object.assign(target.stickyBar||(target.stickyBar={}),parsed.stickyBar);
  if(parsed.schema) Object.assign(target.schema||(target.schema={}),parsed.schema);
  if(parsed.faq) target.faq=parsed.faq;
  if(parsed.templates) target.templates=parsed.templates;
  if(parsed.seo.title) target.title=parsed.seo.title;
  return {ok:true,slug:slug,isNew:isNew};
}

function applyImportedHtmlData(parsed){
  var res=mergeHtmlDataIntoPages(parsed);
  if(!res.ok){
    if(res.reason==='no-slug'){
      var slug=prompt('No canonical URL found to detect the page slug — enter one (e.g. resume-templates/basic):');
      if(!slug) return;
      slug=slug.trim().toLowerCase().replace(/^\/+|\/+$/g,'');
      if(!parsed.seo.canonical) parsed.seo.canonical='https://www.naukri.com/naukri360/'+slug;
      res=mergeHtmlDataIntoPages(parsed);
      if(!res.ok){ toast('Import failed',false); return; }
    } else {
      toast('Could not find any recognizable page data in that HTML',false);
      return;
    }
  }
  curSlug=res.slug; D=allPages[res.slug];
  doSave(); render();
  toast((res.isNew?'Created':'Updated')+' page "/'+res.slug+'" from HTML!');
}

// ═══════════════════════════════════════
// BULK HTML IMPORT — multiple .html/.htm files, or a .zip of pages
// (e.g. the file this CMS's own "Bulk Export" produces), in one go.
// Skips (doesn't prompt for) any file with no detectable canonical/slug —
// reports it in the summary instead, since bulk runs can't block on prompts.
// ═══════════════════════════════════════
function loadJsZipThen(cb){
  if(typeof JSZip!=='undefined'){ cb(); return; }
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
  s.onload=cb;
  s.onerror=function(){ toast('Failed to load JSZip. Check internet connection.',false); };
  document.head.appendChild(s);
}

async function doBulkHtmlImport(){
  var el=document.getElementById('htmlFilesBulk');
  if(!el||!el.files||!el.files.length){toast('Select one or more HTML files (or a ZIP) first',false);return}
  var files=Array.from(el.files);
  var stats={created:0,updated:0,skipped:0,failed:0};

  function handleText(text,label){
    try{
      var parsed=parseImportedHtml(text);
      var res=mergeHtmlDataIntoPages(parsed);
      if(!res.ok){ stats.skipped++; console.warn('[Bulk HTML Import] skipped',label,'-',res.reason); return; }
      if(res.isNew) stats.created++; else stats.updated++;
    }catch(err){ console.error('[Bulk HTML Import] failed on',label,err); stats.failed++; }
  }

  function handleZip(file){
    return new Promise(function(resolve){
      loadJsZipThen(function(){
        JSZip.loadAsync(file).then(function(zip){
          var names=Object.keys(zip.files).filter(function(n){return /\.html?$/i.test(n)&&!zip.files[n].dir});
          var seq=Promise.resolve();
          names.forEach(function(name){
            seq=seq.then(function(){return zip.files[name].async('string');}).then(function(text){handleText(text,name);});
          });
          seq.then(resolve).catch(function(e){console.error(e);resolve();});
        }).catch(function(e){console.error(e);resolve();});
      });
    });
  }

  toast('Importing '+files.length+' file(s)…');
  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(/\.zip$/i.test(f.name)){
      await handleZip(f);
    } else {
      handleText(await f.text(), f.name);
    }
  }
  doSave(); render();
  var msg=stats.created+' created, '+stats.updated+' updated';
  if(stats.skipped) msg+=', '+stats.skipped+' skipped (no canonical URL found)';
  if(stats.failed) msg+=', '+stats.failed+' failed';
  toast('Bulk import done: '+msg, stats.failed===0);
}

}

// Supports separate CDN bases for images, CSS, and fonts.
// Each base maps: local "img/file.png" → "CDN_IMG_BASE/file.png" (strips local folder prefix).
var CDN_SETTINGS = (function(){
  try{
    var s=localStorage.getItem('cms_cdn_settings');
    if(s) return JSON.parse(s);
  }catch(e){}
  // Migration: if old single base URL exists, map it to images only
  try{
    var old=localStorage.getItem('cms_asset_base_url');
    if(old) return {img:old.replace(/\/+$/,''), css:'', fonts:'', cssCombinedFile:''};
  }catch(e){}
  return {img:'https://static.naukimg.com/s/0/0/i/jobseeker', css:'https://static.naukimg.com/s/0/0/c/jobseeker', fonts:'', cssCombinedFile:'styles.css'};
})();
// Keep legacy ASSET_BASE_URL for backward compat (used nowhere critical now)
var ASSET_BASE_URL = CDN_SETTINGS.img||CDN_SETTINGS.css||'';

function saveCdnSettings(imgBase, cssBase, fontsBase, cssCombinedFile){
  CDN_SETTINGS.img   = (imgBase||'').replace(/\/+$/,'');
  CDN_SETTINGS.css   = (cssBase||'').replace(/\/+$/,'');
  CDN_SETTINGS.fonts = (fontsBase||'').replace(/\/+$/,'');
  CDN_SETTINGS.cssCombinedFile = (cssCombinedFile||'').trim();
  ASSET_BASE_URL = CDN_SETTINGS.img||CDN_SETTINGS.css||'';
  try{localStorage.setItem('cms_cdn_settings',JSON.stringify(CDN_SETTINGS));}catch(e){}
}

  saveCdnSettings(v, CDN_SETTINGS.css, CDN_SETTINGS.fonts, CDN_SETTINGS.cssCombinedFile);
}

// Asset path resolver: strips local folder prefix and prepends CDN base.
// ap('img/cv3.png')   → 'https://cdn.example.com/images/cv3.png'
// ap('css/style.css')  → 'https://cdn.example.com/css/style.css'
// ap('fonts/Sat.woff2')→ 'https://cdn.example.com/fonts/Sat.woff2'
function ap(rel){
  if(!rel || rel.indexOf('data:')===0 || rel.indexOf('http')===0) return rel;
  // Determine which CDN base to use based on the local folder prefix
  var base='', stripped=rel;
  if(rel.indexOf('img/')===0 && CDN_SETTINGS.img){
    base=CDN_SETTINGS.img;
    stripped=rel.substring(4); // strip 'img/'
  } else if(rel.indexOf('css/')===0 && CDN_SETTINGS.css){
    base=CDN_SETTINGS.css;
    stripped=rel.substring(4); // strip 'css/'
  } else if(rel.indexOf('fonts/')===0 && CDN_SETTINGS.fonts){
    base=CDN_SETTINGS.fonts;
    stripped=rel.substring(6); // strip 'fonts/'
  }
  if(base) return base+'/'+stripped;
  return rel; // no CDN configured for this type — keep flat relative
}

function splitHeadBody(html){
  var headMatch=html.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
  var bodyMatch=html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
  return {
    head: headMatch ? headMatch[1].trim() : '',
    body: bodyMatch ? bodyMatch[1].trim() : ''
  };
}

function copyToClipboard(text, label){
  // navigator.clipboard is only defined on secure contexts (HTTPS or localhost).
  // Teammates opening http://<lan-ip>:8082 get `navigator.clipboard === undefined`
  // so we cannot rely on the promise path — fall back to execCommand then.
  function execFallback(){
    var ta=document.createElement('textarea');
    ta.value=text;
    ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.top='0'; ta.style.left='-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    var ok=false;
    try { ok=document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    if(ok) toast('✅ '+label+' copied to clipboard!');
    else   toast('Copy blocked by browser — use Ctrl+A then Ctrl+C in the preview box',false);
  }
  if(window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast('✅ '+label+' copied to clipboard!');
    }).catch(execFallback);
  } else {
    execFallback();
  }
}

// FILE SYSTEM ACCESS — Direct save to project folder
// ═══════════════════════════════════════
var projectDirHandle=null;

function fsAccessSupported(){
  // Chromium-only API and requires a secure context (HTTPS or http://localhost).
  // On http://<lan-ip> or on Firefox/Safari it's simply absent.
  return !!(window.isSecureContext && typeof window.showDirectoryPicker==='function');
}

async function pickProjectFolder(){
  if(!fsAccessSupported()){
    toast('Direct folder save needs Chrome/Edge on http://localhost or HTTPS. Use the "Publish CMS Data" or ZIP download instead.', false);
    return;
  }
  try{
    projectDirHandle=await window.showDirectoryPicker({mode:'readwrite'});
    toast('Project folder set: '+projectDirHandle.name+' ✅');
    render();
  }catch(e){
    if(e.name!=='AbortError') toast('Failed: '+e.message,false);
  }
}

async function writeFileToProject(filename, content){
  if(!projectDirHandle){toast('Set project folder first!',false);return false;}
  try{
    // Walk any "a/b/c.ext" style path, creating subdirectories as needed.
    var parts=String(filename).split('/').filter(Boolean);
    var leaf=parts.pop();
    var dir=projectDirHandle;
    for(var i=0;i<parts.length;i++){
      dir=await dir.getDirectoryHandle(parts[i],{create:true});
    }
    var fileHandle=await dir.getFileHandle(leaf,{create:true});
    var writable=await fileHandle.createWritable();
    await writable.write(content);
    await writable.close();
    return true;
  }catch(e){
    toast('Write error: '+e.message,false);
    return false;
  }
}

async function saveSinglePage(slug){
  if(!projectDirHandle){toast('Set project folder first!',false);return;}
  var html=buildPageHtml(slug);if(!html)return;
  var filename='pages/'+slug.replace(/\//g,'-')+'.html';
  toast('Saving '+filename+'…');
  var ok=await writeFileToProject(filename,html);
  if(ok) toast('✅ Saved: '+filename+' → '+projectDirHandle.name+'/');
}

function dlSinglePageHtml(slug){
  var html=buildPageHtml(slug);if(!html){toast('Page not found',false);return}
  var filename=slug.replace(/\//g,'-')+'.html';
  dlFile(html,filename,'text/html');
  toast('Downloaded '+filename);
}

async function saveAllPages(){
  if(!projectDirHandle){toast('Set project folder first!',false);return;}
  var slugs=Object.keys(allPages);
  toast('Saving '+slugs.length+' pages + CMS data to '+projectDirHandle.name+'/pages/ …');
  var saved=0,failed=0;
  for(var i=0;i<slugs.length;i++){
    var slug=slugs[i];
    var html=buildPageHtml(slug);if(!html){failed++;continue;}
    var filename='pages/'+slug.replace(/\//g,'-')+'.html';
    var ok=await writeFileToProject(filename,html);
    if(ok)saved++;else failed++;
  }
  // Keep BOTH cms-data.js copies in sync (root js/ for index.html, pages/js/ for static pages)
  var dataOk1=await writeFileToProject('js/cms-data.js',       generateCmsDataJs());
  var dataOk2=await writeFileToProject('pages/js/cms-data.js', generateCmsDataJs());
  var mapOk  =await writeFileToProject('sitemap.xml',          generateSitemapXml());
  var extra=[]; if(dataOk1||dataOk2)extra.push('cms-data.js'); if(mapOk)extra.push('sitemap.xml');
  toast('✅ Done! '+saved+' pages → /pages/'+(extra.length?' + '+extra.join(' + '):'')+(failed?' ('+failed+' failed)':''));
}

// Helper: fetch a local file as text (for bundling into ZIP)
function fetchLocal(path){
  return fetch(path).then(function(r){return r.ok?r.text():''}).catch(function(){return ''});
}
function fetchLocalBlob(path){
  return fetch(path).then(function(r){return r.ok?r.blob():null}).catch(function(){return null});
}

function dlAllPagesZip(){
  function doZip(){
    var zip=new JSZip();
    var slugs=Object.keys(allPages);

    // 1. Add all generated HTML pages (flat in root)
    slugs.forEach(function(slug){
      var html=buildPageHtml(slug);
      var filename=slug.replace(/\//g,'-')+'.html';
      zip.file(filename, html);
    });

    // 2. Inject LIVE cms-data.js + sitemap.xml from the in-memory CMS so the ZIP
    //    reflects every page we've created — not the stale on-disk copies.
    zip.file('js/cms-data.js', generateCmsDataJs());
    zip.file('sitemap.xml',    generateSitemapXml());

    // 3. Bundle remaining supporting assets from local folder
    var assets=[
      {path:'css/style.css',    zipPath:'css/style.css'},
      {path:'js/app.js',        zipPath:'js/app.js'},
      {path:'js/site.js',       zipPath:'js/site.js'},
      {path:'index.html',       zipPath:'index.html'},
      {path:'admin.html',       zipPath:'admin.html'},
      {path:'serve.bat',        zipPath:'serve.bat'},
      {path:'serve.sh',         zipPath:'serve.sh'},
      {path:'llms.txt',         zipPath:'llms.txt'}
    ];
    // Image files to bundle (SVGs + key PNGs used locally)
    var imgFiles=[
      'nk-pro-logo.svg','tpl-executive-pro.svg','tpl-minimal-edge.svg','tpl-classic-plus.svg',
      'tpl-tech-stack.svg','tpl-creative-spark.svg','tpl-corporate-slate.svg','tpl-fresh-start.svg',

      'rightArrow.png','db-code.png','profile.png','nk-pro-logo.png','green-tick.png',
      'bullet.png','naukri-logo.png','cv-1.jpg','cv-2.jpg','cv-3.jpg',
      'fb.png','twitter.png','linkedin.png','instagram.png'
    ];
    // Font files
    var fontFiles=[
      'Satoshi-Regular.woff2','Satoshi-Regular.woff','Satoshi-Bold.woff2','Satoshi-Bold.woff',
      'Satoshi-Medium.woff2','Satoshi-Medium.woff','Satoshi-Black.woff2','Satoshi-Black.woff',
      'Satoshi-Light.woff2','Satoshi-Light.woff','Satoshi-Variable.woff2','Satoshi-Variable.woff',
      'Satoshi-Italic.woff2','Satoshi-Italic.woff','Satoshi-BoldItalic.woff2','Satoshi-BoldItalic.woff',
      'Satoshi-MediumItalic.woff2','Satoshi-MediumItalic.woff','Satoshi-LightItalic.woff2','Satoshi-LightItalic.woff',
      'Satoshi-BlackItalic.woff2','Satoshi-BlackItalic.woff','Satoshi-VariableItalic.woff2','Satoshi-VariableItalic.woff'
    ];

    toast('Building ZIP with '+slugs.length+' pages + assets…');

    // Fetch all text assets
    var textPromises=assets.map(function(a){
      return fetchLocal(a.path).then(function(txt){if(txt)zip.file(a.zipPath,txt)});
    });
    // Fetch all image blobs
    var imgPromises=imgFiles.map(function(f){
      return fetchLocalBlob('img/'+f).then(function(blob){if(blob)zip.file('img/'+f,blob)});
    });
    // Fetch all font blobs
    var fontPromises=fontFiles.map(function(f){
      return fetchLocalBlob('fonts/'+f).then(function(blob){if(blob)zip.file('fonts/'+f,blob)});
    });

    Promise.all(textPromises.concat(imgPromises).concat(fontPromises)).then(function(){
      return zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    }).then(function(blob){
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='naukri360-site.zip';

function setByPath(path,val){
  try{var parts=path.split(/[\.\[\]]+/).filter(Boolean);var obj=window;
    for(var i=0;i<parts.length-1;i++){var k=isNaN(parts[i])?parts[i]:+parts[i];obj=obj[k]}
    var last=isNaN(parts[parts.length-1])?parts[parts.length-1]:+parts[parts.length-1];obj[last]=val;
  }catch(e){console.warn('Bind:',path,e)}
}
// "Global filter chips" must propagate across every page. Each page stores
// its own copy of globalFilterChips (so the published cms-data.js is
// self-contained), but edits made on the current page need to mirror to all
// other pages — otherwise users see "global" changes only on the page they
// were editing on.
function syncGlobalChips(){
  if(!D || !Array.isArray(D.globalFilterChips)) return;
  var snap=JSON.stringify(D.globalFilterChips);
  Object.keys(allPages).forEach(function(slug){
    if(slug===curSlug) return;
    allPages[slug].globalFilterChips=JSON.parse(snap);
  });
}
// Mirror edits to the truly-global template button (URL + text) across every
// page, same pattern as syncGlobalChips. Per-template "link" overrides still
// win at render time; per-page templateButtonUrl/Text override only when
// "useGlobalTemplateButton" is false on that page.
function syncGlobalTemplateButton(){
  if(!D) return;
  var url=D.globalTemplateButtonUrl, text=D.globalTemplateButtonText;
  Object.keys(allPages).forEach(function(slug){
    if(slug===curSlug) return;
    if(typeof url==='string') allPages[slug].globalTemplateButtonUrl=url;
    if(typeof text==='string') allPages[slug].globalTemplateButtonText=text;
  });
}
// Mirror globalTemplates (per-template link table) across every page so a
// link change on one page propagates everywhere. Per-page templates[i].link
// still wins at render time.
function syncGlobalTemplates(){
  if(!D || !Array.isArray(D.globalTemplates)) return;
  var snap=JSON.stringify(D.globalTemplates);
  Object.keys(allPages).forEach(function(slug){
    if(slug===curSlug) return;
    allPages[slug].globalTemplates=JSON.parse(snap);
  });
}

function getCursorCell(rteEl){
  var sel=window.getSelection(); if(!sel||sel.rangeCount===0) return null;
  var node=sel.getRangeAt(0).startContainer;
  while(node && node!==rteEl){ if(node.nodeType===1 && (node.tagName==='TD'||node.tagName==='TH')) return node; node=node.parentNode; }
  return null;
}
function insertTableAtCursor(rteEl){
  var rows=parseInt(prompt('Number of rows (including header):','3'),10);
  if(!rows||rows<1) return;
  var cols=parseInt(prompt('Number of columns:','3'),10);
  if(!cols||cols<1) return;
  var tStyle='border-collapse:collapse;width:100%;margin:12px 0;font-size:15px';
  var thStyle='border:1px solid #d0d7de;padding:8px 10px;background:#f6f8fa;text-align:left;font-weight:600';
  var tdStyle='border:1px solid #d0d7de;padding:8px 10px;text-align:left';
  var html='<table style="'+tStyle+'"><thead><tr>';
  for(var c=0;c<cols;c++) html+='<th style="'+thStyle+'">Heading '+(c+1)+'</th>';
  html+='</tr></thead><tbody>';
  for(var r=1;r<rows;r++){
    html+='<tr>';
    for(var c=0;c<cols;c++) html+='<td style="'+tdStyle+'">Cell</td>';
    html+='</tr>';
  }
  html+='</tbody></table><p><br></p>';
  rteEl.focus();
  document.execCommand('insertHTML',false,html);
}
function tableAddRow(rteEl){
  var cell=getCursorCell(rteEl); if(!cell){toast('Place cursor inside a table cell first',false);return;}
  var row=cell.parentNode, tbl=row.closest('table'); if(!tbl) return;
  var newRow=row.cloneNode(true);
  Array.prototype.forEach.call(newRow.children,function(td){
    td.innerHTML='Cell';
    if(td.tagName==='TH'){
      var nd=document.createElement('td');
      nd.setAttribute('style','border:1px solid #d0d7de;padding:8px 10px;text-align:left');
      nd.textContent='Cell';
      td.parentNode.replaceChild(nd,td);
    }
  });
  row.parentNode.insertBefore(newRow,row.nextSibling);
}
function tableAddCol(rteEl){
  var cell=getCursorCell(rteEl); if(!cell){toast('Place cursor inside a table cell first',false);return;}
  var idx=Array.prototype.indexOf.call(cell.parentNode.children,cell);
  var tbl=cell.closest('table'); if(!tbl) return;
  Array.prototype.forEach.call(tbl.rows,function(r){
    var ref=r.children[idx];
    var isHead=ref && ref.tagName==='TH';
    var nc=document.createElement(isHead?'th':'td');
    nc.setAttribute('style',isHead
      ? 'border:1px solid #d0d7de;padding:8px 10px;background:#f6f8fa;text-align:left;font-weight:600'
      : 'border:1px solid #d0d7de;padding:8px 10px;text-align:left');
    nc.textContent=isHead?'Heading':'Cell';
    r.insertBefore(nc, ref?ref.nextSibling:null);
  });
}
function tableDelRow(rteEl){
  var cell=getCursorCell(rteEl); if(!cell){toast('Place cursor inside a table cell first',false);return;}
  var row=cell.parentNode, tbl=cell.closest('table');
  if(tbl && tbl.rows.length<=1){ tbl.parentNode.removeChild(tbl); return; }
  row.parentNode.removeChild(row);
}
function tableDelCol(rteEl){
  var cell=getCursorCell(rteEl); if(!cell){toast('Place cursor inside a table cell first',false);return;}
  var idx=Array.prototype.indexOf.call(cell.parentNode.children,cell);
  var tbl=cell.closest('table'); if(!tbl) return;
  Array.prototype.forEach.call(tbl.rows,function(r){ if(r.children[idx]) r.removeChild(r.children[idx]); });
  // If table has no columns left, remove it
  if(tbl.rows[0] && tbl.rows[0].children.length===0) tbl.parentNode.removeChild(tbl);
}

function bindAll(){
  $$('[data-bind]').forEach(function(el){el.addEventListener('input',function(){
    setByPath(el.dataset.bind,el.value);
    if(/^D\.globalFilterChips\b/.test(el.dataset.bind)) syncGlobalChips();
    if(/^D\.globalTemplateButton(Url|Text)\b/.test(el.dataset.bind)) syncGlobalTemplateButton();
    if(/^D\.globalTemplates\b/.test(el.dataset.bind)) syncGlobalTemplates();
    if(/^D\.globalInterlinks\b/.test(el.dataset.bind)) syncGlobalInterlinks();
  })});
  $$('.tpl-file-input').forEach(function(inp){
    inp.addEventListener('change',function(){var idx=parseInt(inp.dataset.tplIdx);var file=inp.files[0];if(!file)return;
      var reader=new FileReader();reader.onload=function(e){D.templates[idx].image=e.target.result;render()};reader.readAsDataURL(file)})});
  $$('[data-rte]').forEach(function(el){
    var path=el.dataset.rte;var wcEl=document.getElementById('wc-'+el.id);
    function sync(){var html=el.innerHTML;if(html==='<br>'||html==='<div><br></div>')html='';setByPath(path,html);if(wcEl){var w=el.innerText.trim();wcEl.textContent=w?w.split(/\s+/).length:0}}
    el.addEventListener('input',sync);el.addEventListener('blur',sync);
    var box=el.closest('.rte-box');
    if(box){box.querySelectorAll('.rb[data-cmd]').forEach(function(btn){
      btn.addEventListener('mousedown',function(e){e.preventDefault()});
      btn.addEventListener('click',function(e){e.preventDefault();el.focus();var cmd=btn.dataset.cmd;var val=btn.dataset.val||null;
        if(cmd==='formatBlock'&&val)document.execCommand(cmd,false,'<'+val+'>');
        else if(cmd==='createLink'){var u=prompt('URL:','https://');if(u)document.execCommand(cmd,false,u)}
        else if(cmd==='insertTable'){insertTableAtCursor(el)}
        else if(cmd==='addTableRow'){tableAddRow(el)}
        else if(cmd==='addTableCol'){tableAddCol(el)}
        else if(cmd==='delTableRow'){tableDelRow(el)}
        else if(cmd==='delTableCol'){tableDelCol(el)}
        else document.execCommand(cmd,false,val);sync()})
    })}
    if(wcEl){var w=el.innerText.trim();wcEl.textContent=w?w.split(/\s+/).length:0}
  });
}

$$('.sb-item').forEach(function(el){el.addEventListener('click',function(){panel=el.dataset.p;render()})});
// Reflect persisted auto-publish state in the topbar checkbox.
(function(){ var c=document.getElementById('auto-publish-chk'); if(c) c.checked=AUTO_PUBLISH; })();
render();
</script>

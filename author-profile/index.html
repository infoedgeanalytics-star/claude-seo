<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Author Profile | Naukri360</title>
  <meta name="description" content="Career expert author profile — Naukri360">
  <meta name="theme-color" content="#4A3AFF">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://www.naukri.com" crossorigin>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════
     HERO  (rendered by main.js from localStorage)
     ════════════════════════════════════════════════════════════ -->
<section class="hero" aria-labelledby="author-name">
  <div class="container">
    <div id="hero-section"><!-- injected --></div>
  </div>
</section>


<!-- ════════════════════════════════════════════════════════════
     ARTICLES  +  SIDEBAR
     ════════════════════════════════════════════════════════════ -->
<div class="container">
  <div class="page-body">

    <!-- Articles -->
    <main class="content-main" id="articles">
      <div class="section-head">
        <h2 class="section-title">Articles</h2>
      </div>

      <!-- Filter tabs (populated by JS) -->
      <div id="filter-row" class="filter-row" role="tablist"
           aria-label="Article category filter"></div>

      <!-- Article cards (populated by JS) -->
      <div id="article-grid" class="article-grid"></div>
    </main>

    <!-- Sidebar -->
    <aside class="content-sidebar" aria-label="Author details">

      <div class="sidebar-card">
        <h2 class="sidebar-title">Popular Topics</h2>
        <ul id="topic-list" class="topic-list"><!-- injected --></ul>
      </div>

      <div id="sidebar-cta" class="sidebar-cta"><!-- injected --></div>

    </aside>

  </div>
</div>


<div id="pub-grid" style="display:none"><!-- publications hidden --></div>
<div id="testi-grid" style="display:none"><!-- testimonials hidden --></div>


<!-- ════════════════════════════════════════════════════════════
     RELATED AUTHORS
     ════════════════════════════════════════════════════════════ -->
<section class="sec-related" aria-labelledby="related-heading">
  <div class="container">
    <h2 class="section-title" id="related-heading">
      More <em>Career Experts</em>
    </h2>
    <div id="related-grid" class="related-grid"><!-- injected --></div>
  </div>
</section>


<!-- Scripts: data layer first, then renderer -->
<script src="js/data.js"></script>
<script src="js/main.js"></script>

</body>
</html>
